# Placeholder values. Replace every one of them before applying, and use sealed-secrets or
# external-secrets for anything real. Never commit a filled-in copy of this file.
#
# The password appears twice on purpose: Postgres reads POSTGRES_PASSWORD, and the app needs a whole
# connection string. Set the same password in both, or the app cannot reach the database it just
# created. The previous version of these manifests inlined "postgres" in the Deployment, so
# following the instruction here left the two out of step. See issue #280.
apiVersion: v1
kind: Secret
metadata:
  name: barako-secrets
  namespace: barako-cms
type: Opaque
stringData:
  JWT__Key: "REPLACE_THIS_WITH_A_REAL_32_CHAR_SECRET_KEY"
  POSTGRES_PASSWORD: "REPLACE_THIS_WITH_REAL_PASSWORD"
  ConnectionStrings__DefaultConnection: "Host=postgres-service;Database=barako_cms;Username=postgres;Password=REPLACE_THIS_WITH_REAL_PASSWORD"
  # Without these the first boot seeds roles and no admin user, and says nothing about it.
  InitialAdmin__Username: "admin"
  InitialAdmin__Password: "REPLACE_THIS_WITH_A_REAL_ADMIN_PASSWORD"
