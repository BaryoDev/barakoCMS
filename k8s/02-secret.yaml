# Placeholder values. Replace every one of them before applying, and use sealed-secrets or
# external-secrets for anything real. Never commit a filled-in copy of this file.
#
# Two database passwords, and they differ. POSTGRES_PASSWORD is the owner's: Postgres reads it, and
# the role Job (04-role-job.yaml) and the backup job connect with it. DB_APP_PASSWORD is the
# password of the role the API connects as (DB_APP_USER, no superuser). The Job creates that role
# with it, and the app's connection string names the same role and password, so set DB_APP_PASSWORD
# in both places. The API refuses to start as a superuser outside Development, so its connection
# string never uses the owner. See issue #280.
apiVersion: v1
kind: Secret
metadata:
  name: barako-secrets
  namespace: barako-cms
type: Opaque
stringData:
  JWT__Key: "REPLACE_THIS_WITH_A_REAL_32_CHAR_SECRET_KEY"
  POSTGRES_PASSWORD: "REPLACE_THIS_WITH_REAL_PASSWORD"
  DB_APP_USER: "barako_app"
  DB_APP_PASSWORD: "REPLACE_THIS_WITH_A_DIFFERENT_APP_ROLE_PASSWORD"
  ConnectionStrings__DefaultConnection: "Host=postgres-service;Database=barako_cms;Username=barako_app;Password=REPLACE_THIS_WITH_A_DIFFERENT_APP_ROLE_PASSWORD"
  # Without these the first boot seeds roles and no admin user, and says nothing about it.
  InitialAdmin__Username: "admin"
  InitialAdmin__Password: "REPLACE_THIS_WITH_A_REAL_ADMIN_PASSWORD"
