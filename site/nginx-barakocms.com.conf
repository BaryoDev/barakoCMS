# barakocms.com is the canonical host. barakocms.baryo.dev keeps working and redirects to it, so
# existing links and the NuGet package pages do not break.
#
# Apply order matters: certbot validates over HTTP on port 80, so the A records must point at this
# VM and the port 80 block must be live BEFORE requesting the certificate. Install this file with
# the 443 blocks commented out, reload, run certbot, then uncomment.

server {
    listen 80;
    listen [::]:80;
    server_name barakocms.com www.barakocms.com barakocms.baryo.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://barakocms.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barakocms.com;

    ssl_certificate     /etc/letsencrypt/live/barakocms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakocms.com/privkey.pem;

    root /var/www/barakocms-site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Next's static export fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The fonts are self-hosted by next/font at build time and are fingerprinted the same way.
    location /_next/media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}

# www and the old baryo.dev host both land on the canonical name rather than serving a duplicate.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.barakocms.com;

    ssl_certificate     /etc/letsencrypt/live/barakocms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakocms.com/privkey.pem;

    return 301 https://barakocms.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barakocms.baryo.dev;

    ssl_certificate     /etc/letsencrypt/live/barakocms.baryo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakocms.baryo.dev/privkey.pem;

    return 301 https://barakocms.com$request_uri;
}
