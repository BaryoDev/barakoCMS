# barakocms.baryo.dev — static site, no application server.
#
# Deployed by site/deploy.sh, which rsyncs the Next static export to /var/www/barakocms-site.

server {
    listen 80;
    listen [::]:80;
    server_name barakocms.baryo.dev;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2 on;` needs nginx 1.25.1+; this host runs 1.20.1, where http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barakocms.baryo.dev;

    ssl_certificate     /etc/letsencrypt/live/barakocms.baryo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barakocms.baryo.dev/privkey.pem;

    root /var/www/barakocms-site;
    index index.html;

    # The export uses trailingSlash, so /marketplace/ is a directory holding index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed assets are safe to cache hard; the HTML is not, or a deploy goes unnoticed.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
