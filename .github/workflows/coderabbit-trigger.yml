name: Request CodeRabbit review

# CodeRabbit is installed and paid for, but it does not review automatically here: its OSS plan
# only auto-reviews repositories with 10 or more stars, and it says so on every pull request
# instead of reviewing. So each PR needed a human to type the trigger, which means the PR that
# most needs a review — one opened while nobody is looking — is the one that does not get one.
#
# This asks for the review instead. It posts the trigger comment and nothing else: no checkout,
# no build, no access to the contributor's code.
#
# pull_request_target rather than pull_request, because a fork PR gets a read-only token under
# pull_request and cannot comment. That trade is only safe because this job never checks out or
# executes the head branch — it runs entirely on the event payload. Do not add a checkout step
# here: with pull_request_target that would run fork code with a write-capable token.

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Ask CodeRabbit to review
        env:
          # CODERABBIT_TRIGGER_TOKEN is a PAT, used only if CodeRabbit ignores the comment when it
          # comes from github-actions[bot]. Falls back to the built-in token, which needs no setup.
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$NUMBER" --repo "$REPO" --body "@coderabbitai review"
