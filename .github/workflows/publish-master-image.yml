name: Publish master image

# Every push to master publishes ghcr.io/baryodev/barako-cms:master, documentation-only pushes
# included, so the tag always matches the branch tip and a consumer can test against the API as it
# is today without a release. The release workflow is untouched: its gate still reads
# <Version>, and nothing here touches NuGet, :latest or :playground.
#
# The console repository (BaryoDev/barakoBrew) runs its contract smoke against this tag. Before it
# existed, the only published images were the last release, which was behind master by every 4.0
# change, so the smoke could only ever be red.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: publish-master-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # A manual dispatch from any other branch would overwrite :master with that branch's build.
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the suite for ${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.suite
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BARAKO_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/baryodev/barako-cms:master-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/BaryoDev/barakoCMS
          cache-from: type=gha,scope=master-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=master-${{ matrix.arch }}

  manifest:
    name: Publish the multi-arch tag
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing asks GitHub for an OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the two builds into :master and :master-<sha>
        env:
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/baryodev/barako-cms:master \
            -t "ghcr.io/baryodev/barako-cms:master-$SHA" \
            ghcr.io/baryodev/barako-cms:master-amd64 \
            ghcr.io/baryodev/barako-cms:master-arm64

      # Read the tag back rather than trusting the push: both platforms must be in the manifest, or
      # the arm runner in the console repository pulls an image that is not there.
      - name: Both platforms are in the manifest
        run: |
          docker buildx imagetools inspect ghcr.io/baryodev/barako-cms:master > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

      # :master is a public tag that other repositories pull, so it is signed and attested like a release image,
      # by digest, after the platform check above. The identity names this workflow file, so a
      # master build verifies against publish-master-image.yml and never against release.yml.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the :master image and verify the signature
        id: sign
        env:
          IDENTITY_REGEXP: '^https://github\.com/BaryoDev/barakoCMS/\.github/workflows/publish-master-image\.yml@refs/heads/master$'
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' ghcr.io/baryodev/barako-cms:master | jq -r '.digest')
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::no digest for :master, got '$DIGEST'"; exit 1 ;;
          esac
          cosign sign --yes "ghcr.io/baryodev/barako-cms@$DIGEST"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "ghcr.io/baryodev/barako-cms@$DIGEST" > /dev/null
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The same provenance step and the same verify-attestation the release runs, so every merge to
      # master proves the release check against ghcr before a release depends on it.
      - name: Attest build provenance for the :master image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/baryodev/barako-cms
          subject-digest: ${{ steps.sign.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify the provenance attestation of the :master image
        env:
          IDENTITY_REGEXP: '^https://github\.com/BaryoDev/barakoCMS/\.github/workflows/publish-master-image\.yml@refs/heads/master$'
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "ghcr.io/baryodev/barako-cms@$DIGEST" > /dev/null
