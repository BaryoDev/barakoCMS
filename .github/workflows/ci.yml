name: CI

on:
  push:
    branches-ignore:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      # Full history: the module-version check walks each .csproj's history to find when its
      # current <Version> was set. The default shallow clone would make it silently find nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Catches a module whose code changed without its <Version> moving. Releases push with
      # --skip-duplicate, so such a module is skipped and its changes never ship — that has
      # swallowed a fix twice, most recently a security fix (see CHANGELOG 3.12.1 and 3.17.1).
      - name: Check module versions
        run: bash scripts/check-module-versions.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test BarakoCMS.Tests
        run: dotnet test BarakoCMS.Tests/BarakoCMS.Tests.csproj --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"
        env:
          # TestContainers needs Docker to be available
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend" >> $GITHUB_STEP_SUMMARY
          echo "✅ BarakoCMS.Tests completed" >> $GITHUB_STEP_SUMMARY

  admin:
    name: Admin UI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate for the npm side, matching the NuGet one below: Critical or High
      # fails the build.
      #
      # This used to fail on Critical only, because three High advisories in `next` had no fix we could
      # take and a permanently red gate is one everybody learns to ignore. Taking Next 16.3 cleared
      # them, so the gate now holds the same line as the .NET side. Keep them the same: a gate that is
      # weaker than its documentation is worse than no gate, because it is trusted anyway.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          # `npm audit` exits non-zero when it finds anything, so its status cannot distinguish
          # "found vulnerabilities" from "could not run". The report itself is the signal, and an
          # unreadable one fails the build rather than passing: a gate that cannot see must not wave
          # things through.
          npm audit --json > audit.json || true

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report — failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            jq -r '.vulnerabilities | to_entries[]
                   | select(.value.severity == "critical" or .value.severity == "high")
                   | "\(.value.severity)\t\(.key)"' audit.json
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # End-to-end suite — drives the real UI (mocked API) to catch the class of bug unit tests miss:
      # empty-vs-error states, routing, forms, per-field-type controls. The whole e2e/ folder runs
      # (chromium), so every feature spec is enforced here, not just honour-checked locally.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (full pack)
        run: npx playwright test --project=chromium

      - name: Admin Summary
        if: always()
        run: |
          echo "## Admin UI" >> $GITHUB_STEP_SUMMARY
          echo "✅ lint, typecheck, vitest, production build, and the full E2E pack completed" >> $GITHUB_STEP_SUMMARY

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catch secrets being ADDED. Report-only for now: dev-only secrets still live in git history
      # (an appsettings.Development.json removed from HEAD earlier), so a hard gate would fail on
      # those until history is scrubbed (roadmap 0.4). Flip continue-on-error off after that.
      # The gates are code, so they get tested too. Both used to pass when they had not actually
      # checked anything — an unreadable report read as "clean". These cases pin that shut.
      - name: Test the vulnerability gates
        run: bash scripts/test-ci-gates.sh

      - name: Secret scan (gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Vulnerable-dependency gate. The backlog was burned down to zero (roadmap 0.3), so this now
      # actually fails the build on Critical/High findings instead of only reporting them — Moderate/Low
      # still surface in the summary but don't block. Uses --format json rather than grepping the
      # console table, since the JSON schema is stable and the console layout isn't a contract.
      - name: Vulnerable dependencies
        run: |
          dotnet restore

          echo '## Vulnerable dependencies' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          dotnet list package --vulnerable --include-transitive --format json --output-version 1 > vuln-report.json

          # Fail closed. Previously an unreadable report made `jq -e` exit non-zero, which the `if`
          # read as "no findings" and the build passed as though clean — the one outcome a security
          # gate must never produce by accident.
          # Check the shape, not merely that a key exists. `has("projects")` is satisfied by an
          # object-valued `projects`, which then counts zero findings and passes — a differently
          # shaped report would sail through as clean.
          if ! jq -e '(.projects | type) == "array"
                      and all(.projects[]; (.frameworks // []) | type == "array")' \
                 vuln-report.json > /dev/null 2>&1; then
            echo "::error::vulnerability report missing, unreadable or not the expected shape — failing closed"
            head -c 500 vuln-report.json || true
            exit 1
          fi

          FOUND=$(jq '[.projects[].frameworks[]? // empty
                       | (.topLevelPackages // []) + (.transitivePackages // [])
                       | .[] | .vulnerabilities[]?
                       | select(.severity == "Critical" or .severity == "High")] | length' \
                    vuln-report.json)
          case "$FOUND" in ''|*[!0-9]*) echo "::error::could not count findings — failing closed"; exit 1 ;; esac

          if [ "$FOUND" -gt 0 ]; then
            echo "::error::$FOUND Critical or High severity vulnerable dependencies found — see the summary above."
            exit 1
          fi
