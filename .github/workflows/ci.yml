name: CI

on:
  push:
    branches-ignore:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["master"]
  # The merge queue tests a batch of PRs against master together, then merges them in order. Without
  # this trigger the queue waits forever for checks that never start, because a required check only
  # counts when it reports on the merge_group event. No path filters here on purpose: the queue is
  # the last gate before master, so it runs everything every time.
  merge_group:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      # Full history: the module-version check walks each .csproj's history to find when its
      # current <Version> was set. The default shallow clone would make it silently find nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Catches a module whose code changed without its <Version> moving. Releases push with
      # --skip-duplicate, so such a module is skipped and its changes never ship — that has
      # swallowed a fix twice, most recently a security fix (see CHANGELOG 3.12.1 and 3.17.1).
      - name: Check module versions
        run: bash scripts/check-module-versions.sh

      # Markdown and YAML are where a botched merge hides: nothing compiles them, so a CHANGELOG
      # full of conflict markers passed every other gate and reached master.
      - name: Check for conflict markers
        run: bash scripts/check-conflict-markers.sh

      # Fragments are validated where a mistake is cheap to fix. Assembly happens at release time.
      - name: Check changelog fragments
        run: bash scripts/changelog-assemble.sh --check

      # A directory Dependabot does not watch produces no error and no pull request, which is why
      # site/ drifted unwatched (#153). This fails the build instead of saying nothing.
      - name: Check Dependabot covers every lockfile
        run: bash scripts/check-dependabot-coverage.sh

      # The check above is only worth its minute if it can fail. Hide the site entry in a copy of
      # the config and confirm it does, the same shape as the secret-scan proof in the security job.
      - name: Prove the Dependabot check can fail
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          ruby -ryaml -e '
            cfg = YAML.load_file(".github/dependabot.yml")
            cfg["updates"] = cfg["updates"].reject { |u| u["directory"] == "/site" }
            File.write(ARGV[0], YAML.dump(cfg))
          ' "$TMP/dependabot.yml"
          if bash scripts/check-dependabot-coverage.sh "$TMP/dependabot.yml"; then
            echo "::error::The Dependabot coverage check passed a config with no /site entry. The gate is not working."
            exit 1
          fi
          echo "Unwatched lockfile was caught. The check is live."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Locked mode: the committed packages.lock.json files are the dependency graph, and a restore
      # that would need to change one fails (NU1004) instead of quietly regenerating it. A version
      # bump lands as a diff to the lock file in the same pull request, or it does not land.
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test BarakoCMS.Tests
        run: >
          dotnet test --project BarakoCMS.Tests/BarakoCMS.Tests.csproj --no-build --configuration Release
          --report-trx --report-trx-filename results.trx --results-directory ./testresults

      # Same reasoning as the release gate: dotnet test exits 0 when it discovers nothing, so a
      # green step is not by itself evidence that anything was checked. Here it also protects the
      # release gate, by catching a discovery break on the pull request that caused it.
      - name: Confirm the suite actually ran
        run: |
          set -euo pipefail
          TRX=$(find ./testresults -name '*.trx' | head -1)
          [ -n "$TRX" ] || { echo "::error::No .trx was produced, so nothing can be verified."; exit 1; }
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*' || true)
          FAILED=$(grep -o 'failed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*' || true)

          # Both counters must actually parse. Defaulting a missing or malformed value to 0 makes
          # the zero-failure assertion pass on an unreadable report, which is the same fail-open
          # shape this whole gate exists to remove.
          case "$TOTAL"  in ''|*[!0-9]*) echo "::error::Could not read a numeric total from $TRX."; exit 1 ;; esac
          case "$FAILED" in ''|*[!0-9]*) echo "::error::Could not read a numeric failed count from $TRX."; exit 1 ;; esac
          echo "ran $TOTAL, failed $FAILED"
          [ "${TOTAL:-0}" -ge 500 ] || { echo "::error::Only $TOTAL tests ran, expected at least 500."; exit 1; }
          [ "${FAILED:-0}" -eq 0 ] || { echo "::error::$FAILED test(s) failed."; exit 1; }
        env:
          # TestContainers needs Docker to be available
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend" >> $GITHUB_STEP_SUMMARY
          echo "✅ BarakoCMS.Tests completed" >> $GITHUB_STEP_SUMMARY

  upgrade:
    name: Upgrade from 3.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Nothing in the test suite covers this. IntegrationTestFixture forces Development, so the
      # suite always runs CreateOrUpdate against a fresh database, while production runs CreateOnly
      # against one that already has data. The upgrade lives entirely in that gap, which is how a
      # Marten major bump shipped with nobody having run it (#277).
      #
      # The script stands up a real 3.21.0 database through the released image, asserts 4.0 refuses
      # it, applies the reviewed migration, and then proves an event appends to a stream that
      # already existed and the projection daemon resumed rather than restarting.
      - name: Prove the 3.x database can be upgraded
        run: bash scripts/upgrade-check.sh

  restore:
    name: Restore a backup
    runs-on: ubuntu-latest
    # This job runs a shell script out of the pull request's own branch, so it must not hold a token
    # that can write anything. Read-only, and the checkout leaves no credential behind for that
    # script to find.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The deliverable is not "a backup file appears", it is "we restored one and it came back".
      # Until this job existed the only exercised backup path was the development compose stack and
      # no restore had been run anywhere, which matters most immediately before an upgrade, because
      # a failed upgrade's remedy is a restore (#282).
      #
      # The database is dropped rather than truncated between backup and restore: restoring over a
      # schema that is still present can succeed because what the dump failed to carry is already
      # there.
      - name: Back up, destroy, restore, and serve
        run: bash scripts/restore-check.sh

  compose:
    name: Compose files resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `docker compose config` is the only cheap thing that proves a compose file is more than
      # plausible YAML: it parses it, resolves every variable and fails on the first one that has
      # no value. A production compose file nobody has run is what #307 was about, so the one this
      # repository ships gets checked on every change to it.
      - name: The development and try-out files parse
        run: |
          set -euo pipefail
          for f in docker-compose.yml docker-compose.hub.yml; do
            docker compose -f "$f" config >/dev/null
            echo "$f resolves"
          done

      # The quickstart has the same required-secret guards as production, so it gets the same
      # treatment. Its README tells you to copy a .env.example that the quickstart folder does not
      # contain, which is why the values are supplied here rather than from a file.
      - name: The quickstart file parses
        env:
          DB_PASSWORD: ci-not-a-real-password
          JWT_KEY: ci-not-a-real-key-at-least-32-characters
          ADMIN_PASSWORD: ci-not-a-real-password
        run: |
          set -euo pipefail
          docker compose -f quickstart/docker-compose.yml config >/dev/null
          echo "quickstart/docker-compose.yml resolves"

      # The production file deliberately has no defaults for the secrets, so it is checked twice:
      # once with a filled env, and once without, where it has to fail rather than boot on a blank.
      - name: The production file resolves with a filled env
        run: |
          set -euo pipefail
          cp .env.prod.example /tmp/ci.env
          cat >> /tmp/ci.env <<'ENV'
          DB_PASSWORD=ci-not-a-real-password
          JWT_KEY=ci-not-a-real-key-at-least-32-characters
          ADMIN_PASSWORD=ci-not-a-real-password
          ENV
          docker compose --env-file /tmp/ci.env -f docker-compose.prod.yml config > /tmp/prod.resolved

          # Nothing may build. The whole point of the file is that a host with only Docker can run it.
          if grep -qE '^[[:space:]]+build:' /tmp/prod.resolved; then
            echo "::error::docker-compose.prod.yml resolves to a build step; it must run published images"
            exit 1
          fi
          grep -q 'ghcr.io/baryodev/barako-cms:' /tmp/prod.resolved
          grep -q 'ghcr.io/baryodev/barako-admin:' /tmp/prod.resolved
          # The admin's API URL is a runtime variable, not a build arg (#309).
          grep -q 'NEXT_PUBLIC_API_URL: https://api.example.com' /tmp/prod.resolved

      - name: The production file refuses to resolve without a JWT key
        run: |
          set -euo pipefail
          cp .env.prod.example /tmp/ci-nojwt.env
          cat >> /tmp/ci-nojwt.env <<'ENV'
          DB_PASSWORD=ci-not-a-real-password
          ADMIN_PASSWORD=ci-not-a-real-password
          ENV
          if docker compose --env-file /tmp/ci-nojwt.env -f docker-compose.prod.yml config >/dev/null 2>&1; then
            echo "::error::docker-compose.prod.yml resolved with no JWT_KEY set"
            exit 1
          fi
          echo "refused, as it should"

  admin:
    name: Admin UI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate for the npm side, matching the NuGet one below: Critical or High
      # fails the build.
      #
      # This used to fail on Critical only, because three High advisories in `next` had no fix we could
      # take and a permanently red gate is one everybody learns to ignore. Taking Next 16.3 cleared
      # them, so the gate now holds the same line as the .NET side. Keep them the same: a gate that is
      # weaker than its documentation is worse than no gate, because it is trusted anyway.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          # `npm audit` exits non-zero when it finds anything, so its status cannot distinguish
          # "found vulnerabilities" from "could not run". The report itself is the signal, and an
          # unreadable one fails the build rather than passing: a gate that cannot see must not wave
          # things through.
          # The registry's audit endpoint has gone away for minutes at a time (503, or a hang), which
          # made every run fail for a reason that had nothing to do with the code. Retry for a while
          # before concluding that the report is unreadable. The gate below still fails closed.
          for attempt in 1 2 3 4 5; do
            timeout 180 npm audit --json > audit.json || true
            if jq -e '.metadata.vulnerabilities.total' audit.json >/dev/null 2>&1; then break; fi
            echo "npm audit attempt $attempt returned no report, retrying in 60s"
            sleep 60
          done

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report, failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            jq -r '.vulnerabilities | to_entries[]
                   | select(.value.severity == "critical" or .value.severity == "high")
                   | "\(.value.severity)\t\(.key)"' audit.json
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # End-to-end suite — drives the real UI (mocked API) to catch the class of bug unit tests miss:
      # empty-vs-error states, routing, forms, per-field-type controls. The whole e2e/ folder runs
      # (chromium), so every feature spec is enforced here, not just honour-checked locally.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (full pack)
        run: npx playwright test --project=chromium

      - name: Admin Summary
        if: always()
        run: |
          echo "## Admin UI" >> $GITHUB_STEP_SUMMARY
          echo "✅ lint (including jsx-a11y), typecheck, vitest, production build, and the full E2E pack (including the axe accessibility scan) completed" >> $GITHUB_STEP_SUMMARY

  site:
    name: Site (barakocms.baryo.dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same line as the admin and .NET gates: Critical or High fails, and an unreadable report fails
      # closed rather than waving things through.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          # The registry's audit endpoint has gone away for minutes at a time (503, or a hang), which
          # made every run fail for a reason that had nothing to do with the code. Retry for a while
          # before concluding that the report is unreadable. The gate below still fails closed.
          for attempt in 1 2 3 4 5; do
            timeout 180 npm audit --json > audit.json || true
            if jq -e '.metadata.vulnerabilities.total' audit.json >/dev/null 2>&1; then break; fi
            echo "npm audit attempt $attempt returned no report, retrying in 60s"
            sleep 60
          done

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report, failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "site npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      # Covers the changelog renderer, which drops raw HTML and allowlists link protocols. The
      # changelog is edited by pull request, so this is the gate between a CHANGELOG.md diff and a
      # script running on every visitor of a static page.
      - name: Unit tests
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json

          # A run that discovers no test files exits zero, so the count is asserted rather than
          # the status. Read from the JSON reporter, not the console output: the human output is
          # ANSI-coloured under CI and not under a local pipe, so a grep for "Test Files  1" passes
          # on a laptop and fails on the runner.
          COUNT=$(jq -r '.numTotalTests // 0' test-results.json)
          [ "$COUNT" -gt 0 ] 2>/dev/null || {
            echo "::error::vitest discovered no tests (numTotalTests=$COUNT)"; exit 1; }
          echo "site unit tests: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # The build renders the marketplace from NuGet. It must also succeed when that call fails —
      # the fallback manifest exists for exactly that — so a NuGet outage cannot break the build.
      - name: Build (static export)
        run: npm run build

      - name: Check every page exported
        run: |
          test -f out/index.html || { echo "::error::landing page missing from the export"; exit 1; }
          test -f out/marketplace/index.html || { echo "::error::marketplace missing from the export"; exit 1; }
          test -f out/changelog/index.html || { echo "::error::changelog missing from the export"; exit 1; }

          # The changelog is rendered from CHANGELOG.md at build time. If the build context ever
          # stops including the repository root, or the heading format changes, the page would
          # export as a valid but empty shell — so assert the newest version actually rendered.
          VERSION=$(grep -m1 -oE '^## \[[0-9][^]]*\]' ../CHANGELOG.md | tr -d '#[] ')
          grep -q "$VERSION" out/changelog/index.html || {
            echo "::error::changelog exported without its newest release ($VERSION)"; exit 1; }
          echo "changelog exported, newest release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          grep -q "barakocms-module" out/marketplace/index.html \
            || { echo "::error::the marketplace did not render the discovery tag"; exit 1; }

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, and the default depth of 1 gives it one commit: historical
          # secrets are invisible and the commit-based allowlist entries below can never match.
          # The scan was running against almost nothing.
          fetch-depth: 0


      # Catch secrets being ADDED. Report-only for now: dev-only secrets still live in git history
      # (an appsettings.Development.json removed from HEAD earlier), so a hard gate would fail on
      # those until history is scrubbed (roadmap 0.4). Flip continue-on-error off after that.
      # The gates are code, so they get tested too. Both used to pass when they had not actually
      # checked anything — an unreadable report read as "clean". These cases pin that shut.
      - name: Test the vulnerability gates
        run: bash scripts/test-ci-gates.sh

      # The hosted Action refuses to run for a GitHub organization without a paid licence, and this
      # step carried continue-on-error, so it reported success and had never scanned anything:
      #   [BaryoDev] is an organization. License key is required.
      # The binary is MIT licensed and free. Same scanner, no licence, and allowed to fail.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          # Verify before extracting, not after. This pipeline used to pipe the download straight
          # into tar, which extracts and then runs an unauthenticated binary inside a job holding
          # GITHUB_TOKEN. Checksum taken from the release's own checksums.txt.
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

      # Advisory only, and continue-on-error is correct here precisely because it is not the gate.
      # The Action annotates findings inline on the diff, which the binary cannot do. It needs an
      # org licence, so it is also the step that can lapse: if the licence expires or the secret is
      # missing on a fork, this goes yellow and the blocking scan above is unaffected. That split is
      # deliberate. Putting the gate on the licensed step is how this repo ended up with a green
      # secret scan that had never scanned anything.
      - name: Annotate findings on the diff (advisory)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # A scanner that finds nothing is indistinguishable from a scanner that is not running, which
      # is exactly how the previous step went unnoticed. Plant a credential and fail if the scan
      # does not catch it.
      #
      # --no-git against a scratch directory, deliberately. The first version cloned the repo and
      # committed the secret, which works locally and not here: actions/checkout is shallow, and a
      # scan over a one-commit clone did not see the planted commit. This checks the rules and the
      # allowlist are live, which is the failure that actually happened, and it cannot be broken by
      # clone depth.
      - name: Prove the scan can fail
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cp .gitleaks.toml "$TMP/.gitleaks.toml"

          # Prefixes assembled from halves. Written whole, even as "ghp_$(...)", the prefix sits
          # next to the substitution and matches the github-pat rule, so the scan flags this file.
          # That is the gate behaving correctly, so the fixture bends rather than the rule.
          AWS_P="AK"; AWS_P="${AWS_P}IA"
          GH_P="gh"; GH_P="${GH_P}p_"
          # Read a bounded amount first. Piping /dev/urandom into `tr | head -c N` closes the pipe
          # on head's exit, tr dies of SIGPIPE, and under `set -euo pipefail` the assignment fails
          # before the scan runs. A control that dies before it checks anything is worse than none.
          RAND=$(head -c 256 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9')
          AWS_ID="${AWS_P}$(printf '%s' "${RAND}" | LC_ALL=C tr -d 'a-z' | cut -c1-16)"
          GH_TOK="${GH_P}$(printf '%s' "${RAND}" | cut -c1-36)"
          {
            printf 'aws_access_key_id = "%s"\n' "$AWS_ID"
            printf 'gh_token = "%s"\n' "$GH_TOK"
          } > "$TMP/planted.txt"

          if gitleaks dir "$TMP" --config "$TMP/.gitleaks.toml" --redact --no-banner; then
            echo "::error::The secret scan did not catch a planted credential. The gate is not working."
            exit 1
          fi
          echo "Planted secret was caught. The scan is live."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Vulnerable-dependency gate. The backlog was burned down to zero (roadmap 0.3), so this now
      # actually fails the build on Critical/High findings instead of only reporting them — Moderate/Low
      # still surface in the summary but don't block. Uses --format json rather than grepping the
      # console table, since the JSON schema is stable and the console layout isn't a contract.
      - name: Vulnerable dependencies
        run: |
          dotnet restore --locked-mode

          echo '## Vulnerable dependencies' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          dotnet list package --vulnerable --include-transitive --format json --output-version 1 > vuln-report.json

          # Fail closed. Previously an unreadable report made `jq -e` exit non-zero, which the `if`
          # read as "no findings" and the build passed as though clean — the one outcome a security
          # gate must never produce by accident.
          # Check the shape, not merely that a key exists. `has("projects")` is satisfied by an
          # object-valued `projects`, which then counts zero findings and passes — a differently
          # shaped report would sail through as clean.
          if ! jq -e '(.projects | type) == "array"
                      and all(.projects[]; (.frameworks // []) | type == "array")' \
                 vuln-report.json > /dev/null 2>&1; then
            echo "::error::vulnerability report missing, unreadable or not the expected shape — failing closed"
            head -c 500 vuln-report.json || true
            exit 1
          fi

          FOUND=$(jq '[.projects[].frameworks[]? // empty
                       | (.topLevelPackages // []) + (.transitivePackages // [])
                       | .[] | .vulnerabilities[]?
                       | select(.severity == "Critical" or .severity == "High")] | length' \
                    vuln-report.json)
          case "$FOUND" in ''|*[!0-9]*) echo "::error::could not count findings — failing closed"; exit 1 ;; esac

          if [ "$FOUND" -gt 0 ]; then
            echo "::error::$FOUND Critical or High severity vulnerable dependencies found — see the summary above."
            exit 1
          fi

  # The SBOM is generated in the release workflow, which means it had never run: it was added after
  # the last release, so the first time anything executed it would have been the 4.0 release itself.
  # That is the shape this project keeps getting caught by, a gate that can only be tested by
  # publishing, and the remedy is the same each time: run it where it is cheap to be wrong.
  #
  # This job proves the tooling still produces a bill of materials with contents. The release job
  # remains the one that publishes it; nothing is uploaded here.
  sbom:
    name: SBOM generates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # Deliberately the same commands and the same tool versions as the release job. A smoke test
      # that drifts from the thing it is smoke testing stops being evidence about it.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --version 5.4.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p sbom
          dotnet CycloneDX barakoCMS.sln --output sbom --filename barakoCMS.cdx.json --json

          npm --prefix admin ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom/barako-admin.cdx.json admin/package.json

          # A tool that writes nothing still exits 0, so check the files rather than the command.
          for f in sbom/barakoCMS.cdx.json sbom/barako-admin.cdx.json; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty."; exit 1; }
            COMPONENTS=$(python3 -c "import json,sys; print(len(json.load(open('$f')).get('components', [])))")
            [ "$COMPONENTS" -gt 0 ] || { echo "::error::$f lists no components, so it describes nothing."; exit 1; }
            echo "$f: $COMPONENTS components" >> "$GITHUB_STEP_SUMMARY"
          done

  # Nothing in CI ever read k8s/ (#383). That is how an unparseable memory quantity, 128Mw, sat in
  # the repo through several releases: the manifests are only ever read by a human running kubectl.
  #
  # This job sends them to a real API server. The two cheaper options were both tried against the
  # manifests as they stood before #280 was fixed, and both passed them:
  #
  #   kubectl apply --dry-run=client --validate=strict  ->  exit 0, "deployment.apps/barako-cms created (dry run)"
  #   kubeconform -strict -summary                      ->  exit 0, "Valid: 1, Invalid: 0"
  #
  # A resource quantity is just a string in the OpenAPI schema, so schema validation has nothing to
  # check it against. Only the API server runs the quantity parser, which is why this job pays for a
  # cluster. kind boots in about half a minute and nothing is deployed into it.
  k8s:
    name: Kubernetes manifests apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start a throwaway cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: barako-manifest-check

      - name: The manifests apply
        run: bash scripts/check-k8s-manifests.sh k8s

      # The manifests are correct today, so a green run here proves nothing on its own: the same
      # green is what a broken validator produces. scripts/testdata/k8s-known-bad/ holds the
      # pre-#280 deployment verbatim, 128Mw and all, and this step fails the build if the API
      # server accepts it.
      - name: Prove the check can fail
        run: |
          set -euo pipefail
          if bash scripts/check-k8s-manifests.sh scripts/testdata/k8s-known-bad; then
            echo "::error::The API server accepted the pre-#280 manifests, which contain memory: \"128Mw\". This gate is not working."
            exit 1
          fi
          echo "The known-bad manifests were rejected. The gate is live."

  # The admin against the real API, with nothing mocked.
  #
  # Every other admin job mocks the API with page.route, so it proves the admin behaves correctly
  # given fixtures the same person wrote, and cannot prove those fixtures match the server. That gap
  # shipped a bug and kept it: the History panel read `versions` from a response that had returned
  # `items` since the envelope change, rendered an empty list rather than failing, and every mocked
  # spec stayed green because the mock returned `versions` too.
  #
  # Heavier than the other jobs because it stands up Postgres, the API and the admin. That cost is
  # the point: it is the only job in which the two halves of this product meet.
  smoke:
    name: Admin against the real API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: admin

      - name: Stand up the stack and run the unmocked pack
        run: bash scripts/smoke-check.sh
