name: CI

on:
  push:
    branches-ignore:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      # Full history: the module-version check walks each .csproj's history to find when its
      # current <Version> was set. The default shallow clone would make it silently find nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Catches a module whose code changed without its <Version> moving. Releases push with
      # --skip-duplicate, so such a module is skipped and its changes never ship — that has
      # swallowed a fix twice, most recently a security fix (see CHANGELOG 3.12.1 and 3.17.1).
      - name: Check module versions
        run: bash scripts/check-module-versions.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test BarakoCMS.Tests
        run: >
          dotnet test BarakoCMS.Tests/BarakoCMS.Tests.csproj --no-build --configuration Release
          --verbosity normal --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=results.trx" --results-directory ./testresults

      # Same reasoning as the release gate: dotnet test exits 0 when it discovers nothing, so a
      # green step is not by itself evidence that anything was checked. Here it also protects the
      # release gate, by catching a discovery break on the pull request that caused it.
      - name: Confirm the suite actually ran
        run: |
          set -euo pipefail
          TRX=$(find ./testresults -name '*.trx' | head -1)
          [ -n "$TRX" ] || { echo "::error::No .trx was produced, so nothing can be verified."; exit 1; }
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*' || true)
          FAILED=$(grep -o 'failed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*' || true)

          # Both counters must actually parse. Defaulting a missing or malformed value to 0 makes
          # the zero-failure assertion pass on an unreadable report, which is the same fail-open
          # shape this whole gate exists to remove.
          case "$TOTAL"  in ''|*[!0-9]*) echo "::error::Could not read a numeric total from $TRX."; exit 1 ;; esac
          case "$FAILED" in ''|*[!0-9]*) echo "::error::Could not read a numeric failed count from $TRX."; exit 1 ;; esac
          echo "ran $TOTAL, failed $FAILED"
          [ "${TOTAL:-0}" -ge 500 ] || { echo "::error::Only $TOTAL tests ran, expected at least 500."; exit 1; }
          [ "${FAILED:-0}" -eq 0 ] || { echo "::error::$FAILED test(s) failed."; exit 1; }
        env:
          # TestContainers needs Docker to be available
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend" >> $GITHUB_STEP_SUMMARY
          echo "✅ BarakoCMS.Tests completed" >> $GITHUB_STEP_SUMMARY

  admin:
    name: Admin UI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate for the npm side, matching the NuGet one below: Critical or High
      # fails the build.
      #
      # This used to fail on Critical only, because three High advisories in `next` had no fix we could
      # take and a permanently red gate is one everybody learns to ignore. Taking Next 16.3 cleared
      # them, so the gate now holds the same line as the .NET side. Keep them the same: a gate that is
      # weaker than its documentation is worse than no gate, because it is trusted anyway.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          # `npm audit` exits non-zero when it finds anything, so its status cannot distinguish
          # "found vulnerabilities" from "could not run". The report itself is the signal, and an
          # unreadable one fails the build rather than passing: a gate that cannot see must not wave
          # things through.
          npm audit --json > audit.json || true

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report — failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            jq -r '.vulnerabilities | to_entries[]
                   | select(.value.severity == "critical" or .value.severity == "high")
                   | "\(.value.severity)\t\(.key)"' audit.json
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # End-to-end suite — drives the real UI (mocked API) to catch the class of bug unit tests miss:
      # empty-vs-error states, routing, forms, per-field-type controls. The whole e2e/ folder runs
      # (chromium), so every feature spec is enforced here, not just honour-checked locally.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (full pack)
        run: npx playwright test --project=chromium

      - name: Admin Summary
        if: always()
        run: |
          echo "## Admin UI" >> $GITHUB_STEP_SUMMARY
          echo "✅ lint, typecheck, vitest, production build, and the full E2E pack completed" >> $GITHUB_STEP_SUMMARY

  site:
    name: Site (barakocms.baryo.dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same line as the admin and .NET gates: Critical or High fails, and an unreadable report fails
      # closed rather than waving things through.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          npm audit --json > audit.json || true

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report — failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "site npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      # Covers the changelog renderer, which drops raw HTML and allowlists link protocols. The
      # changelog is edited by pull request, so this is the gate between a CHANGELOG.md diff and a
      # script running on every visitor of a static page.
      - name: Unit tests
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json

          # A run that discovers no test files exits zero, so the count is asserted rather than
          # the status. Read from the JSON reporter, not the console output: the human output is
          # ANSI-coloured under CI and not under a local pipe, so a grep for "Test Files  1" passes
          # on a laptop and fails on the runner.
          COUNT=$(jq -r '.numTotalTests // 0' test-results.json)
          [ "$COUNT" -gt 0 ] 2>/dev/null || {
            echo "::error::vitest discovered no tests (numTotalTests=$COUNT)"; exit 1; }
          echo "site unit tests: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # The build renders the marketplace from NuGet. It must also succeed when that call fails —
      # the fallback manifest exists for exactly that — so a NuGet outage cannot break the build.
      - name: Build (static export)
        run: npm run build

      - name: Check every page exported
        run: |
          test -f out/index.html || { echo "::error::landing page missing from the export"; exit 1; }
          test -f out/marketplace/index.html || { echo "::error::marketplace missing from the export"; exit 1; }
          test -f out/changelog/index.html || { echo "::error::changelog missing from the export"; exit 1; }

          # The changelog is rendered from CHANGELOG.md at build time. If the build context ever
          # stops including the repository root, or the heading format changes, the page would
          # export as a valid but empty shell — so assert the newest version actually rendered.
          VERSION=$(grep -m1 -oE '^## \[[0-9][^]]*\]' ../CHANGELOG.md | tr -d '#[] ')
          grep -q "$VERSION" out/changelog/index.html || {
            echo "::error::changelog exported without its newest release ($VERSION)"; exit 1; }
          echo "changelog exported, newest release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          grep -q "barakocms-module" out/marketplace/index.html \
            || { echo "::error::the marketplace did not render the discovery tag"; exit 1; }

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catch secrets being ADDED. Report-only for now: dev-only secrets still live in git history
      # (an appsettings.Development.json removed from HEAD earlier), so a hard gate would fail on
      # those until history is scrubbed (roadmap 0.4). Flip continue-on-error off after that.
      # The gates are code, so they get tested too. Both used to pass when they had not actually
      # checked anything — an unreadable report read as "clean". These cases pin that shut.
      - name: Test the vulnerability gates
        run: bash scripts/test-ci-gates.sh

      # The hosted Action refuses to run for a GitHub organization without a paid licence, and this
      # step carried continue-on-error, so it reported success and had never scanned anything:
      #   [BaryoDev] is an organization. License key is required.
      # The binary is MIT licensed and free. Same scanner, no licence, and allowed to fail.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      # Advisory only, and continue-on-error is correct here precisely because it is not the gate.
      # The Action annotates findings inline on the diff, which the binary cannot do. It needs an
      # org licence, so it is also the step that can lapse: if the licence expires or the secret is
      # missing on a fork, this goes yellow and the blocking scan above is unaffected. That split is
      # deliberate. Putting the gate on the licensed step is how this repo ended up with a green
      # secret scan that had never scanned anything.
      - name: Annotate findings on the diff (advisory)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # A scanner that finds nothing is indistinguishable from a scanner that is not running, which
      # is exactly how the previous step went unnoticed. Plant a credential and fail if the scan
      # does not catch it.
      #
      # --no-git against a scratch directory, deliberately. The first version cloned the repo and
      # committed the secret, which works locally and not here: actions/checkout is shallow, and a
      # scan over a one-commit clone did not see the planted commit. This checks the rules and the
      # allowlist are live, which is the failure that actually happened, and it cannot be broken by
      # clone depth.
      - name: Prove the scan can fail
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cp .gitleaks.toml "$TMP/.gitleaks.toml"

          # Prefixes assembled from halves. Written whole, even as "ghp_$(...)", the prefix sits
          # next to the substitution and matches the github-pat rule, so the scan flags this file.
          # That is the gate behaving correctly, so the fixture bends rather than the rule.
          AWS_P="AK"; AWS_P="${AWS_P}IA"
          GH_P="gh"; GH_P="${GH_P}p_"
          {
            printf 'aws_access_key_id = "%s"\n' "${AWS_P}$(LC_ALL=C tr -dc 'A-Z0-9' < /dev/urandom | head -c 16)"
            printf 'gh_token = "%s"\n' "${GH_P}$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 36)"
          } > "$TMP/planted.txt"

          if gitleaks detect --no-git --source "$TMP" --config "$TMP/.gitleaks.toml" --redact --no-banner; then
            echo "::error::The secret scan did not catch a planted credential. The gate is not working."
            exit 1
          fi
          echo "Planted secret was caught. The scan is live."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Vulnerable-dependency gate. The backlog was burned down to zero (roadmap 0.3), so this now
      # actually fails the build on Critical/High findings instead of only reporting them — Moderate/Low
      # still surface in the summary but don't block. Uses --format json rather than grepping the
      # console table, since the JSON schema is stable and the console layout isn't a contract.
      - name: Vulnerable dependencies
        run: |
          dotnet restore

          echo '## Vulnerable dependencies' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          dotnet list package --vulnerable --include-transitive --format json --output-version 1 > vuln-report.json

          # Fail closed. Previously an unreadable report made `jq -e` exit non-zero, which the `if`
          # read as "no findings" and the build passed as though clean — the one outcome a security
          # gate must never produce by accident.
          # Check the shape, not merely that a key exists. `has("projects")` is satisfied by an
          # object-valued `projects`, which then counts zero findings and passes — a differently
          # shaped report would sail through as clean.
          if ! jq -e '(.projects | type) == "array"
                      and all(.projects[]; (.frameworks // []) | type == "array")' \
                 vuln-report.json > /dev/null 2>&1; then
            echo "::error::vulnerability report missing, unreadable or not the expected shape — failing closed"
            head -c 500 vuln-report.json || true
            exit 1
          fi

          FOUND=$(jq '[.projects[].frameworks[]? // empty
                       | (.topLevelPackages // []) + (.transitivePackages // [])
                       | .[] | .vulnerabilities[]?
                       | select(.severity == "Critical" or .severity == "High")] | length' \
                    vuln-report.json)
          case "$FOUND" in ''|*[!0-9]*) echo "::error::could not count findings — failing closed"; exit 1 ;; esac

          if [ "$FOUND" -gt 0 ]; then
            echo "::error::$FOUND Critical or High severity vulnerable dependencies found — see the summary above."
            exit 1
          fi
