blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/BaryoDev/barakoCMS/security/advisories/new
    about: Report privately. Please do not open a public issue for anything exploitable.
  - name: A bug in the console (barakoBrew)
    url: https://github.com/BaryoDev/barakoBrew/issues/new
    about: The console lives in its own repository (BaryoDev/barakoBrew). It has no issue
      templates yet, so this opens a plain form there. Say what you saw, the console version
      shown on screen, and whether the same action works against the API directly.
  - name: Chat on Discord
    url: https://discord.gg/7GYKzDx7Z2
    about: Ask a quick question, say hello, or talk through an idea before opening an issue.
  - name: Question or idea
    url: https://github.com/BaryoDev/barakoCMS/discussions
    about: For anything open-ended, or to sound out a large change before building it.
  - name: How to contribute
    url: https://github.com/BaryoDev/barakoCMS/blob/master/CONTRIBUTING.md
    about: Branch naming, the test requirement for bug fixes, and how to publish a module.
