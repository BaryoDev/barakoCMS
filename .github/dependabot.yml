version: 2
updates:
  # All *.csproj projects live under the repo root; Dependabot's NuGet ecosystem discovers them
  # from here. Versions live in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Two pull requests per ecosystem, never one per package: routine bumps in one, majors in
      # another. Majors are kept separate because they are the ones that need reading, not because
      # they need to arrive individually — eight separate major PRs is just the same noise wearing
      # a different hat.
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dotnet-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # FastEndpoints 5.22+ moves its testing package to xunit v3, which cannot coexist with the
      # xunit v2 this suite uses — every test file fails with CS0433 duplicate types. Taking it needs
      # the xunit v2 to v3 migration first.
      #
      # Held by update-type rather than by a `versions:` range on purpose. A version range suppresses
      # security updates as well as version updates, so a fix released above the held line would
      # never be offered. `version-update:` types only hold the routine bumps; a security update still
      # comes through.
      - dependency-name: "FastEndpoints"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Security"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Swagger"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Testing"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # xunit.v3.extensibility.core must equal xunit.v3, which depends on it, and the two pin each
      # other exactly. Dependabot cannot move one without the other (a group only batches the
      # updates that exist), so a lone bump broke restore with NU1004. The ignore stays and the
      # pair is moved by hand. When xunit.v3 is bumped, bump this line in Directory.Packages.props
      # to the same version. Held by update-type so security updates still come through.
      - dependency-name: "xunit.v3.extensibility.core"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # The runtime is .NET 10 LTS, so no 11.x of the framework-band packages.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]

      # BarakoCMS is referenced as a package in two places, and neither should move: the module
      # template, whose version is a placeholder filled in when a module is generated, and the
      # fixture in BarakoCMS.Tests/Fixtures/LegacyModules/Legacy42, built against 4.2.0 on purpose
      # because it is what a module compiled before 4.3.0 looks like. The solution never builds it;
      # only that folder's build.sh does.
      - dependency-name: "BarakoCMS"

  # Keep the Actions themselves current — the same "insufficient logging/CVE surfaces late" concern
  # the NuGet/npm gates exist for applies to third-party Actions too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The base images are pinned by digest in Dockerfile and Dockerfile.suite, and a digest never
  # moves by itself. "/" covers both files. The k8s manifests carry image references too.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/k8s"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # A new .NET major is a framework upgrade, and a new postgres major needs a dump and restore of
    # the data directory. Neither is a pin refresh, so both are done by hand. Minor and patch
    # updates, and the barako-cms tag in the k8s manifests, still come through.
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]

  # The postgres, pgvector and caddy pins in the compose files (docker-compose*.yml at the root
  # and the quickstart folder).
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/quickstart"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      compose:
        patterns: ["*"]
