version: 2
updates:
  # All *.csproj projects live under the repo root; Dependabot's NuGet ecosystem discovers them
  # from here. Versions live in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Two pull requests per ecosystem, never one per package: routine bumps in one, majors in
      # another. Majors are kept separate because they are the ones that need reading, not because
      # they need to arrive individually — eight separate major PRs is just the same noise wearing
      # a different hat.
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dotnet-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # FastEndpoints 5.22+ moves its testing package to xunit v3, which cannot coexist with the
      # xunit v2 this suite uses — every test file fails with CS0433 duplicate types. Taking it needs
      # the xunit v2 to v3 migration first.
      #
      # Held by update-type rather than by a `versions:` range on purpose. A version range suppresses
      # security updates as well as version updates, so a fix released above the held line would
      # never be offered. `version-update:` types only hold the routine bumps; a security update still
      # comes through.
      - dependency-name: "FastEndpoints"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Security"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Swagger"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Testing"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # xunit.v3.extensibility.core carries no version of its own here: it must equal xunit.v3,
      # which depends on it, and those two pin each other exactly. Directory.Packages.props says so
      # in a comment directly above the line.
      #
      # Grouping does not solve this, which is worth saying because it is the obvious first answer.
      # A group batches the updates that exist into one pull request; it cannot wait for the other
      # half of a family to get a release. When 4.0.1 of this package shipped and xunit.v3 stayed at
      # 4.0.0, the group moved the one that had somewhere to go and left the one that did not, and
      # locked restore refused with NU1004. That failed the build, the module template job and the
      # security scan, the last because the vulnerability report comes from a restore that never
      # finished.
      #
      # So it is held, and moved by hand alongside xunit.v3. That is a manual step and it is smaller
      # than repairing a broken pull request every time one half of the pair releases.
      #
      # Held by update-type rather than by a version range, for the same reason as the entries
      # above: a range would suppress security updates too.
      - dependency-name: "xunit.v3.extensibility.core"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # BarakoCMS is referenced as a package in two places, and neither should move: the module
      # template, whose version is a placeholder filled in when a module is generated, and the
      # fixture in BarakoCMS.Tests/Fixtures/LegacyModules/Legacy42, built against 4.2.0 on purpose
      # because it is what a module compiled before 4.3.0 looks like. The solution never builds it;
      # only that folder's build.sh does.
      - dependency-name: "BarakoCMS"

  # Keep the Actions themselves current — the same "insufficient logging/CVE surfaces late" concern
  # the NuGet/npm gates exist for applies to third-party Actions too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
