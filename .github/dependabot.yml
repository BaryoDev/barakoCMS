version: 2
updates:
  # All *.csproj projects live under the repo root; Dependabot's NuGet ecosystem discovers them
  # from here. Versions live in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Two pull requests per ecosystem, never one per package: routine bumps in one, majors in
      # another. Majors are kept separate because they are the ones that need reading, not because
      # they need to arrive individually — eight separate major PRs is just the same noise wearing
      # a different hat.
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dotnet-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # FastEndpoints 5.22+ moves its testing package to xunit v3, which cannot coexist with the
      # xunit v2 this suite uses — every test file fails with CS0433 duplicate types. Taking it needs
      # the xunit v2 to v3 migration first.
      #
      # Held by update-type rather than by a `versions:` range on purpose. A version range suppresses
      # security updates as well as version updates, so a fix released above the held line would
      # never be offered. `version-update:` types only hold the routine bumps; a security update still
      # comes through.
      - dependency-name: "FastEndpoints"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Security"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Swagger"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "FastEndpoints.Testing"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      admin:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      admin-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Next 16.1+ breaks this admin's end-to-end suite: 28 failures where a mocked action leaves the
      # URL at /login? instead of navigating. Reverted once before on the same symptom, so it is the
      # upgrade that is wrong for us, not the tests.
      #
      # Held by update-type, never by a `versions:` range. A range suppresses security updates too,
      # and the three advisories standing in SECURITY.md all trace back to this very pin — holding
      # the routine bumps must not also hold the fix for them.
      - dependency-name: "next"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # barakocms.baryo.dev. Its own Next app, its own lockfile, and unwatched until now (#153): a
  # missing ecosystem entry is silence rather than an error, so nothing ever said the landing page
  # was drifting. scripts/check-dependabot-coverage.sh is what says it now, and CI runs it.
  #
  # No `next` hold here, unlike /admin. That hold exists because the admin's end-to-end suite fails
  # on Next 16.1+; the site has no such suite and is already on 16.3.0, so copying the hold across
  # would pin it below the version it is running.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      site-major:
        patterns: ["*"]
        update-types: ["major"]

  # Keep the Actions themselves current — the same "insufficient logging/CVE surfaces late" concern
  # the NuGet/npm gates exist for applies to third-party Actions too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
