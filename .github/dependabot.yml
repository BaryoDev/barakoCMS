version: 2
updates:
  # All *.csproj projects live under the repo root; Dependabot's NuGet ecosystem discovers them
  # from here. Versions live in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one reviewable pull request. Ungrouped, a repo this size
      # opens one per package and the routine noise buries anything that actually matters.
      # Majors are deliberately left out, so they arrive alone and get read.
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      admin:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the Actions themselves current — the same "insufficient logging/CVE surfaces late" concern
  # the NuGet/npm gates exist for applies to third-party Actions too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
