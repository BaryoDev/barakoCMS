services:
  # 1. Reverse Proxy (Caddy) - Handles HTTPS & Routing
  caddy:
    image: caddy:alpine
    container_name: barako-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_API=${DOMAIN_API}
      - DOMAIN_ADMIN=${DOMAIN_ADMIN}
    depends_on:
      - app
      - admin

  # 2. Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: barako-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend API
  app:
    container_name: barako-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-barako_cms};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - JWT__Key=${JWT_KEY}
      - CORS__AllowedOrigins=https://${DOMAIN_ADMIN}
      - InitialAdmin__Username=${ADMIN_USER:-admin}
      - InitialAdmin__Password=${ADMIN_PASSWORD}
      - Kubernetes__Enabled=false
      # Caddy terminates TLS and is the only thing that reaches the app, so its X-Forwarded-For is
      # what rate limiting and the audit log key on. Named by network because the compose bridge
      # assigns its address; override if your bridge is not in the default range.
      - ForwardedHeaders__Enabled=true
      - ForwardedHeaders__KnownNetworks__0=${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Frontend Admin UI
  admin:
    container_name: barako-admin
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # ⚠️ CRITICAL: Next.js needs this at BUILD TIME
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
    restart: always

  # 5. Nightly backup
  #
  # This stack had none. The one hardened backup path was wired into the development compose file
  # only, so the deployment that holds real data was the one with nothing behind it.
  #
  # backup-cron.sh checks pg_dump's own exit code rather than gzip's, proves the archive
  # decompresses and looks like a dump, enforces a minimum size, and only then publishes it. Its
  # header explains why: an earlier version piped straight into gzip, and because gzip succeeds on
  # empty input, months of backups were 20-byte files reporting success.
  #
  # The volume is its own, not Postgres's. A backup that dies with the thing it backs up is not a
  # backup, which is what the k8s CronJob used to do before it got the barako-backups PVC.
  db-backup:
    image: postgres:16-alpine
    container_name: barako-db-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_prod_backups:/backups
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-0 2 * * *}"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]

volumes:
  postgres_prod_data:
  postgres_prod_backups:
  caddy_data:
  caddy_config:
