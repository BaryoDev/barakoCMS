# barakoCMS production stack, from published images. This is the only production compose file.
#
#   cp .env.prod.example .env
#   # edit .env, then point the domain's DNS A record at this machine
#   docker compose -f docker-compose.prod.yml up -d
#
# Nothing is built here. Every service is an image the release workflow publishes
# (ghcr.io/baryodev/barako-cms, barako-cms-decaf, mirrored to arnelirobles/* on Docker
# Hub), so the host needs Docker and this file, not a .NET SDK. Each release attaches this file
# with everything it mounts as barako-cms-prod-<version>.tar.gz, so the host needs no checkout
# either. scripts/build-prod-bundle.sh builds it and the list of files it carries is in that script.
#
# The API only. The console is BaryoDev/barakoBrew and deploys from its own repository,
# pointed at DOMAIN_API.
#
# Caddy requests a TLS certificate on first start, so the domain must already resolve
# here before you bring the stack up. See docs/deploy-in-production.md.
#
# To keep the JWT key, admin password and database password in files instead of .env, add
# docker-compose.secrets.yml with a second -f and set SECRETS_AS_FILES=true. That variable only
# lets those three required checks pass when the value comes from a file. See
# docs/deploy-in-production.md, "Secrets as files".
#
# For local development use docker-compose.yml. For a local try-out of the published
# images with no TLS use docker-compose.hub.yml.

services:
  # 1. Reverse Proxy (Caddy) - Handles HTTPS & Routing
  caddy:
    image: caddy:alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 # caddy:alpine
    container_name: barako-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_API=${DOMAIN_API:?set DOMAIN_API in .env, for example api.example.com}
      # Certificate expiry warnings go here. Let's Encrypt wants a contact address.
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    depends_on:
      - app
    # Caddy sits alone with the app on the proxy network, at an address that does not move, so the
    # app can trust that one address for X-Forwarded-For instead of a whole bridge range.
    networks:
      proxy:
        ipv4_address: ${PROXY_ADDRESS:-10.87.51.2}
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE # binds ports 80 and 443
    security_opt:
      - no-new-privileges:true
    labels:
      org.barakocms.hardening.root: "the certificate and config volumes already exist owned by root on a running deployment, and a non-root user could not read them"
    mem_limit: ${PROXY_MEM_LIMIT:-512m}
    pids_limit: ${PROXY_PIDS_LIMIT:-256}
    # The image has wget and no curl. The admin endpoint listens on loopback inside the container
    # and answers as soon as Caddy is up, before any certificate is issued.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Database (PostgreSQL)
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f # pgvector/pgvector:pg16
    container_name: barako-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # Sized for a 2 GB VM that also runs the API, and each value can be changed from .env. The
    # defaults for 4 GB and 8 GB, and the stock values to go back to, are in
    # docs/deploy-in-production.md, "Postgres on a small server". max_connections stays at the stock
    # 100 so an existing deployment's connection pool keeps fitting. pg_stat_statements is loaded so
    # slow queries can be found; the postgres-extensions job below installs it and creates the app
    # role the API connects as.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - jit=${PG_JIT:-off}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:mode=1777,size=8m
    cap_drop: [ALL]
    cap_add:
      - CHOWN # the entrypoint fixes the data directory's owner on a fresh volume
      - DAC_OVERRIDE # initdb and the entrypoint write into directories they do not own
      - FOWNER # initdb sets modes on files it created as root
      - SETGID # gosu drops to the postgres group
      - SETUID # gosu drops to the postgres user
    security_opt:
      - no-new-privileges:true
    labels:
      org.barakocms.hardening.root: "the image entrypoint starts as root to prepare the data directory, then drops to the postgres user"
    mem_limit: ${DB_MEM_LIMIT:-2g}
    pids_limit: ${DB_PIDS_LIMIT:-512}

  # Runs scripts/db-app-role.sql as the database owner once Postgres is up, then exits. It installs
  # pg_stat_statements, creates the login role the API connects as (DB_APP_USER, no superuser),
  # sets its password and makes it owner of what is in schema public. A separate one-shot rather
  # than a script in docker-entrypoint-initdb.d, because that only runs on an empty volume and an
  # existing deployment would never get the role. The script is safe to run on every start.
  #
  # The API waits for this job to finish, because its ALTERs take locks on the tables and the API
  # connects as the role the job creates. If the job fails the API does not start; its log says why.
  # It reads DB_APP_USER and DB_APP_PASSWORD from its environment, never from the command line.
  postgres-extensions:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # postgres:16-alpine
    container_name: barako-postgres-extensions
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-barako_cms}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-}
      DB_APP_USER: ${DB_APP_USER:-barako_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/db-app-role.sql"]
    volumes:
      - ./scripts/db-app-role.sql:/db-app-role.sql:ro
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${EXTENSIONS_MEM_LIMIT:-128m}
    pids_limit: ${EXTENSIONS_PIDS_LIMIT:-64}
    labels:
      org.barakocms.hardening.one-shot: "runs the app role script and exits, so it has nothing to check"

  # 3. Backend API
  #
  # The full suite: engine plus every module. For the lean core swap in
  # ghcr.io/baryodev/barako-cms-decaf and add only the modules you want in your own host.
  #
  # BARAKO_TAG is required rather than defaulting to latest, because with a default the
  # next `docker compose pull` is an unplanned major upgrade.
  app:
    image: ghcr.io/baryodev/barako-cms:${BARAKO_TAG:?pin a version in .env, for example 3.21.0}
    container_name: barako-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-barako_cms};Username=${DB_APP_USER:-barako_app};Password=${DB_APP_PASSWORD:-${SECRETS_AS_FILES:?set DB_APP_PASSWORD in .env, the API connects as this role}}
      # Refuses to start below 32 characters, deliberately.
      - JWT__Key=${JWT_KEY:-${SECRETS_AS_FILES:?set JWT_KEY in .env to at least 32 random characters}}
      # The console's origin plus your own site. A browser request from an origin that is not
      # listed fails CORS, which reads as a broken API rather than a missing setting, so
      # FRONTEND_ORIGINS is asked for at deploy time instead of found later.
      - CORS__AllowedOrigins=${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS in .env}
      - InitialAdmin__Username=${ADMIN_USER:-admin}
      - InitialAdmin__Password=${ADMIN_PASSWORD:-${SECRETS_AS_FILES:?set ADMIN_PASSWORD in .env, this is your first sign-in}}
      - Kubernetes__Enabled=false
      # Caddy terminates TLS, so its X-Forwarded-For is what rate limiting and the audit log key on.
      # Only Caddy's own address is trusted. Any other container that can reach app:8080 is not, so
      # it cannot choose the client IP. TRUSTED_PROXY_NETWORK is still read, so a deployment that set
      # it keeps trusting what it named; it is empty unless you set it.
      - ForwardedHeaders__Enabled=true
      - ForwardedHeaders__KnownProxies__0=${PROXY_ADDRESS:-10.87.51.2}
      - ForwardedHeaders__KnownNetworks__0=${TRUSTED_PROXY_NETWORK:-}
      # The origin the API puts in the links it hands out, and the host names it will answer to. The
      # Host header is written by whoever sent the request, so without these a caller chooses both.
      # Passed through rather than assumed: quickstart has had them and this file did not, so the
      # runbook told operators to set variables that reached nothing. Defaults are today's behaviour
      # exactly, an unset base URL (the feed and the OAuth start endpoints say which key to set).
      # AllowedHosts defaults to DOMAIN_API, the host Caddy serves, plus the service name app, which
      # callers inside the compose network use (the on-demand TLS ask in docs/deploy-in-production.md).
      # The API refuses to start in Production when it accepts any host. Set ALLOWED_HOSTS
      # (semicolon separated) to replace the list, keeping app in it if something calls it by name, or Security__AllowAnyHost=true to accept any host on purpose.
      - App__BaseUrl=${APP_BASE_URL:-}
      - AllowedHosts=${ALLOWED_HOSTS:-${DOMAIN_API};app}
      # The site the feed points at, which is the client's front end rather than this API. Preferred
      # over App__BaseUrl when set.
      - Feeds__SiteUrl=${FEEDS_SITE_URL:-}
    networks:
      - default
      - proxy
    # The role job first: it creates the role this API connects as and takes locks on the tables.
    depends_on:
      postgres:
        condition: service_healthy
      postgres-extensions:
        condition: service_completed_successfully
    user: "1654:1654"
    read_only: true
    tmpfs:
      # Upload buffering and the runtime's scratch files. The image root is read-only, so this and
      # the home directory are the only places the API can write.
      - /tmp:mode=1777,size=${API_TMP_SIZE:-512m}
      - /home/app:uid=1654,gid=1654,mode=0700,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${API_MEM_LIMIT:-1g}
    pids_limit: ${API_PIDS_LIMIT:-512}
    # The image has no shell or curl, so the probe is built into the app. It asks this container's own
    # listener, so no host or database is involved.
    healthcheck:
      test: ["CMD", "dotnet", "barakoCMS.dll", "--health-probe"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 4. Nightly backup
  #
  # This stack had none. The one hardened backup path was wired into the development compose file
  # only, so the deployment that holds real data was the one with nothing behind it.
  #
  # backup-cron.sh checks pg_dump's own exit code rather than gzip's, proves the archive
  # decompresses and looks like a dump, enforces a minimum size, and only then publishes it. Its
  # header explains why: an earlier version piped straight into gzip, and because gzip succeeds on
  # empty input, months of backups were 20-byte files reporting success.
  #
  # The volume is its own, not Postgres's. A backup that dies with the thing it backs up is not a
  # backup, which is what the k8s CronJob used to do before it got the barako-backups PVC.
  db-backup:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # postgres:16-alpine
    container_name: barako-db-backup
    restart: always
    # Postgres accepting connections is not the same as there being anything to back up, so
    # backup-cron.sh waits for the application schema before taking its proof backup. See the
    # comment there for why that wait is asked of Postgres rather than of the API.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_prod_backups:/backups
      - ./scripts:/scripts:ro
    environment:
      # How long to wait for the API to create the schema before giving up and leaving the first
      # backup to the nightly schedule. Passed explicitly: a value in .env is only Compose
      # interpolation and never reaches the container on its own.
      BACKUP_SCHEMA_WAIT_SECONDS: ${BACKUP_SCHEMA_WAIT_SECONDS:-300}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-0 2 * * *}"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # An optional copy of each checked backup to S3-compatible storage, off this host. Off while
      # BACKUP_S3_BUCKET is empty. See docs/backup-and-restore.md for the write-only key to use.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-barako-backups/}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    read_only: ${BACKUP_READ_ONLY:-true}
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    cap_add:
      - SETUID # crond switches to the crontab's user before it runs the job
      - SETGID # crond sets the group list the same way
    security_opt:
      - no-new-privileges:true
    labels:
      org.barakocms.hardening.root: "busybox crond has to start as root to run a job"
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    pids_limit: ${BACKUP_PIDS_LIMIT:-128}
    # The job is a shell script, so the check is that crond is running. A failed backup is reported in
    # the log, which the health of the process cannot show.
    healthcheck:
      test: ["CMD-SHELL", "pidof crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default: {}
  # A fixed subnet so Caddy's address is known in advance. Docker refuses to create it if another
  # network on the host already overlaps it, and a host or VPN route in the same range would stop
  # the containers reaching it. Either way, set PROXY_SUBNET and PROXY_ADDRESS in .env to a free
  # range. See docs/deploy-in-production.md, "Client IPs behind Caddy".
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-10.87.51.0/28}

volumes:
  postgres_prod_data:
  postgres_prod_backups:
  caddy_data:
  caddy_config:
