# barakoCMS production stack, from published images. This is the only production compose file.
#
#   cp .env.prod.example .env
#   # edit .env, then point both domains' DNS A records at this machine
#   docker compose -f docker-compose.prod.yml up -d
#
# Nothing is built here. Every service is an image the release workflow publishes
# (ghcr.io/baryodev/barako-cms, barako-cms-decaf, barako-admin, mirrored to
# arnelirobles/* on Docker Hub), so the host needs Docker and this file, not a .NET
# SDK and a Node toolchain.
#
# The admin used to be built here because of a comment claiming Next.js needs the API
# URL at build time. It does not for this image: admin/entrypoint.sh regenerates
# public/env-config.js from any NEXT_PUBLIC_* variable at container start, and the
# browser reads that. See #309.
#
# Caddy requests TLS certificates on first start, so both domains must already resolve
# here before you bring the stack up. See docs/deploy-in-production.md.
#
# For local development use docker-compose.yml. For a local try-out of the published
# images with no TLS use docker-compose.hub.yml.

services:
  # 1. Reverse Proxy (Caddy) - Handles HTTPS & Routing
  caddy:
    image: caddy:alpine
    container_name: barako-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_API=${DOMAIN_API:?set DOMAIN_API in .env, for example api.example.com}
      - DOMAIN_ADMIN=${DOMAIN_ADMIN:?set DOMAIN_ADMIN in .env, for example admin.example.com}
      # Certificate expiry warnings go here. Let's Encrypt wants a contact address.
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    depends_on:
      - app
      - admin

  # 2. Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: barako-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env, do not run production on the default}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend API
  #
  # The full suite: engine plus every module. For the lean core swap in
  # ghcr.io/baryodev/barako-cms-decaf and add only the modules you want in your own host.
  #
  # BARAKO_TAG is required rather than defaulting to latest, because with a default the
  # next `docker compose pull` is an unplanned major upgrade.
  app:
    image: ghcr.io/baryodev/barako-cms:${BARAKO_TAG:?pin a version in .env, for example 3.21.0}
    container_name: barako-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-barako_cms};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      # Refuses to start below 32 characters, deliberately.
      - JWT__Key=${JWT_KEY:?set JWT_KEY in .env to at least 32 random characters}
      # The admin domain plus your own site. A browser request from an origin that is not
      # listed fails CORS, which reads as a broken API rather than a missing setting, so
      # FRONTEND_ORIGINS is asked for at deploy time instead of found later.
      - CORS__AllowedOrigins=https://${DOMAIN_ADMIN},${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS in .env}
      - InitialAdmin__Username=${ADMIN_USER:-admin}
      - InitialAdmin__Password=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env, this is your first sign-in}
      - Kubernetes__Enabled=false
      # Caddy terminates TLS and is the only thing that reaches the app, so its X-Forwarded-For is
      # what rate limiting and the audit log key on. Named by network because the compose bridge
      # assigns its address; override if your bridge is not in the default range.
      - ForwardedHeaders__Enabled=true
      - ForwardedHeaders__KnownNetworks__0=${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
      # The origin the API puts in the links it hands out, and the host names it will answer to. The
      # Host header is written by whoever sent the request, so without these a caller chooses both.
      # Passed through rather than assumed: quickstart has had them and this file did not, so the
      # runbook told operators to set variables that reached nothing. Defaults are today's behaviour
      # exactly, an unset base URL (the feed and the OAuth start endpoints say which key to set) and
      # any host, so an existing deployment is unchanged until somebody fills them in.
      - App__BaseUrl=${APP_BASE_URL:-}
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      # The site the feed points at, which is the client's front end rather than this API. Preferred
      # over App__BaseUrl when set.
      - Feeds__SiteUrl=${FEEDS_SITE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Frontend Admin UI
  admin:
    image: ghcr.io/baryodev/barako-admin:${BARAKO_TAG}
    container_name: barako-admin
    restart: always
    environment:
      # Read at container start by entrypoint.sh, which writes public/env-config.js. The
      # browser reads that file, so this is the API address as the browser sees it, not as
      # the container sees it.
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_API}
    depends_on:
      - app

  # 5. Nightly backup
  #
  # This stack had none. The one hardened backup path was wired into the development compose file
  # only, so the deployment that holds real data was the one with nothing behind it.
  #
  # backup-cron.sh checks pg_dump's own exit code rather than gzip's, proves the archive
  # decompresses and looks like a dump, enforces a minimum size, and only then publishes it. Its
  # header explains why: an earlier version piped straight into gzip, and because gzip succeeds on
  # empty input, months of backups were 20-byte files reporting success.
  #
  # The volume is its own, not Postgres's. A backup that dies with the thing it backs up is not a
  # backup, which is what the k8s CronJob used to do before it got the barako-backups PVC.
  db-backup:
    image: postgres:16-alpine
    container_name: barako-db-backup
    restart: always
    # Postgres accepting connections is not the same as there being anything to back up, so
    # backup-cron.sh waits for the application schema before taking its proof backup. See the
    # comment there for why that wait is asked of Postgres rather than of the API.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_prod_backups:/backups
      - ./scripts:/scripts:ro
    environment:
      # How long to wait for the API to create the schema before giving up and leaving the first
      # backup to the nightly schedule. Passed explicitly: a value in .env is only Compose
      # interpolation and never reaches the container on its own.
      BACKUP_SCHEMA_WAIT_SECONDS: ${BACKUP_SCHEMA_WAIT_SECONDS:-300}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-barako_cms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-0 2 * * *}"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]

volumes:
  postgres_prod_data:
  postgres_prod_backups:
  caddy_data:
  caddy_config:
