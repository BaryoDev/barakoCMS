services:
  app:
    container_name: barako-cms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only, like the database below. Published on every interface, a development stack with
      # a seeded admin is reachable from the network. Behind your own proxy, change the left side.
      - "127.0.0.1:5005:8080"
    environment:
      # WARNING: This compose file is for LOCAL DEVELOPMENT ONLY. Use docker-compose.prod.yml
      # (which requires real secrets with no defaults) for any real deployment. Every password
      # here comes from one variable, DB_PASSWORD, so setting it in .env changes the app, the
      # database and the backup together instead of leaving them out of step.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=barako_cms;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - JWT__Key=${JWT_SECRET:-dev-only-key-minimum-32-chars-long}
      - InitialAdmin__Username=${ADMIN_USER:-admin}
      # No default. Unset, the seeder generates a password and prints it once to the container log
      # (docker compose logs app). A literal here was a published SuperAdmin password.
      - InitialAdmin__Password=${ADMIN_PASSWORD:-}
      # Explicit rather than inherited from ASPNETCORE_ENVIRONMENT. This file is local development,
      # so the API explorer is wanted; saying so means a deployer who changes the environment does
      # not silently change what the API exposes.
      - Swagger__Enabled=${SWAGGER_ENABLED:-true}
    # Deliberately no host mounts. A kubeconfig bind gives anything in the container every context
    # and token in it; the Kubernetes monitor needs read access to one namespace, so mount a
    # service-account token scoped to that namespace instead.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      # Upload buffering and the runtime's scratch files. The image root is read-only, so this and
      # the home directory are the only places the API can write.
      - /tmp:mode=1777,size=${API_TMP_SIZE:-512m}
      - /home/app:uid=1654,gid=1654,mode=0700,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${API_MEM_LIMIT:-1g}
    pids_limit: ${API_PIDS_LIMIT:-512}
    # The image has no shell or curl, so the probe is built into the app. It asks this container's own
    # listener, so no host or database is involved.
    healthcheck:
      test: ["CMD", "dotnet", "barakoCMS.dll", "--health-probe"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f # pgvector/pgvector:pg16
    container_name: barako-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: barako_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Loopback only. The app reaches postgres over the compose network; this mapping exists so a
      # developer can attach psql. Published on all interfaces it was an open database with a
      # known password on any host that is not a private laptop.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:mode=1777,size=8m
    cap_drop: [ALL]
    cap_add:
      - CHOWN # the entrypoint fixes the data directory's owner on a fresh volume
      - DAC_OVERRIDE # initdb and the entrypoint write into directories they do not own
      - FOWNER # initdb sets modes on files it created as root
      - SETGID # gosu drops to the postgres group
      - SETUID # gosu drops to the postgres user
    security_opt:
      - no-new-privileges:true
    labels:
      org.barakocms.hardening.root: "the image entrypoint starts as root to prepare the data directory, then drops to the postgres user"
    mem_limit: ${DB_MEM_LIMIT:-2g}
    pids_limit: ${DB_PIDS_LIMIT:-512}

  db-backup:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # postgres:16-alpine
    container_name: barako-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: barako_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Schedule: 2:00 AM daily
      BACKUP_CRON_SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 7
      # An optional copy of each checked backup to S3-compatible storage, off this host. Off while
      # BACKUP_S3_BUCKET is empty. See docs/backup-and-restore.md.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-barako-backups/}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    read_only: ${BACKUP_READ_ONLY:-true}
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    cap_add:
      - SETUID # crond switches to the crontab's user before it runs the job
      - SETGID # crond sets the group list the same way
      - DAC_OVERRIDE # ./backups is a host folder owned by the developer, not by root
    security_opt:
      - no-new-privileges:true
    labels:
      org.barakocms.hardening.root: "busybox crond has to start as root to run a job"
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    pids_limit: ${BACKUP_PIDS_LIMIT:-128}
    # The job is a shell script, so the check is that crond is running. A failed backup is reported in
    # the log, which the health of the process cannot show.
    healthcheck:
      test: ["CMD-SHELL", "pidof crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
