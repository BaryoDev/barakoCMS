# Keeps the JWT key, the admin password and the database passwords in files instead of .env.
#
#   SECRETS_AS_FILES=true docker compose -f docker-compose.prod.yml -f docker-compose.secrets.yml up -d
#
# The five files this reads, and the owner and mode to give them, are in
# docs/deploy-in-production.md, "Secrets as files".
#
# It is a separate file because compose refuses to start when a declared secret file is missing, so
# docker-compose.prod.yml declares none and an .env-only deployment is unchanged. Put
# SECRETS_AS_FILES=true in .env if you would rather not type it. Its only job is to let the required
# checks in the prod file pass while JWT_KEY, ADMIN_PASSWORD and DB_PASSWORD are unset.
#
# Each file is mounted in the app under the configuration key it holds (JWT__Key is JWT:Key). The
# API reads the directory named by BARAKO_SECRETS_DIR, default /run/secrets, and a secret file wins
# over an environment value for the same key. The plain env values are blanked below.

services:
  app:
    environment:
      JWT__Key: ""
      InitialAdmin__Password: ""
      ConnectionStrings__DefaultConnection: ""
    secrets:
      - source: jwt_key
        target: JWT__Key
      - source: admin_password
        target: InitialAdmin__Password
      - source: db_connection_string
        target: ConnectionStrings__DefaultConnection

  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_password
        target: db_password

  # The two services below take their passwords from the environment in the prod file. They read the
  # files instead, and join group 1654 so a 0440 file owned by 1654:1654 is readable to them too.
  # The role job also takes the app role's password, from its own file. The API reads that password
  # inside db_connection_string, and the two must be the same value.
  postgres-extensions:
    environment:
      PGPASSWORD: ""
      DB_APP_PASSWORD: ""
    entrypoint: ["/bin/sh", "-c", "PGPASSWORD=\"$$(cat /run/secrets/db_password)\" DB_APP_PASSWORD=\"$$(cat /run/secrets/db_app_password)\" exec \"$$@\"", "--"]
    group_add: ["1654"]
    secrets:
      - source: db_password
        target: db_password
      - source: db_app_password
        target: db_app_password

  db-backup:
    environment:
      POSTGRES_PASSWORD: ""
    entrypoint: ["/bin/sh", "-c", "POSTGRES_PASSWORD=\"$$(cat /run/secrets/db_password)\" exec /bin/sh /scripts/backup-cron.sh"]
    group_add: ["1654"]
    secrets:
      - source: db_password
        target: db_password

secrets:
  jwt_key:
    file: ./secrets/jwt_key
  admin_password:
    file: ./secrets/admin_password
  # The whole connection string, because that is the one place the API reads its database password.
  # It names the app role (DB_APP_USER, default barako_app) and that role's password.
  db_connection_string:
    file: ./secrets/db_connection_string
  # The database owner's password alone, for Postgres, the role job and the backup job.
  db_password:
    file: ./secrets/db_password
  # The app role's password alone, for the role job. The same value as in db_connection_string.
  db_app_password:
    file: ./secrets/db_app_password
